name: Windows installer smoke

# Catches low-level PowerShell problems before a release:
# - ps1 parser errors / bad quoting / accidental non-ASCII console issues
# - install.ps1 path mistakes for stable and test channels
# - Codex skill visibility: test must create ~/.codex/skills/redbeacon-test*/SKILL.md
# - uninstall.ps1 deleting the wrong channel
#
# This uses a local fake OSS server and tiny fake bundles. The real desktop
# bundle is smoke-tested in cli/.github/workflows/build-bundle.yml.

on:
  workflow_dispatch: {}
  push:
    branches: ['main', 'ci/bundle', 'refactor/**']
    paths:
      - 'install/**'
      - 'tools/release.sh'
      - '.github/workflows/windows-installer-smoke.yml'
  pull_request:
    paths:
      - 'install/**'
      - 'tools/release.sh'
      - '.github/workflows/windows-installer-smoke.yml'

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
          $files = @(
            "install/install.ps1",
            "install/install-test.ps1",
            "install/uninstall.ps1",
            "install/uninstall-test.ps1"
          )
          foreach($file in $files){
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if($errors -and $errors.Count -gt 0){
              $errors | Format-List | Out-String | Write-Error
              throw "$file has PowerShell parser errors"
            }
            Write-Host "PowerShell syntax ok: $file"
          }

      - name: Install and uninstall against fake OSS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()

          $fake = Join-Path $env:RUNNER_TEMP "fake-oss"
          $build = Join-Path $env:RUNNER_TEMP "fake-build"
          New-Item -ItemType Directory -Force -Path $fake, $build | Out-Null

          function New-FakeChannel($Channel){
            if($Channel -eq "test"){
              $appName = "RedBeacon_test"
              $cliName = "redbeacon-test-cli"
              $appPrefix = "app/test"
              $manifestName = "latest-test.json"
              $skillPrefix = "skill-test"
              $skillFile = "redbeacon-test.md"
              $skillCommand = "redbeacon-test"
              $runtimeFolder = ".redbeacon_test"
              $typeSuffix = "Test"
            } else {
              $appName = "RedBeacon"
              $cliName = "redbeacon-cli"
              $appPrefix = "app"
              $manifestName = "latest.json"
              $skillPrefix = "skill"
              $skillFile = "redbeacon.md"
              $skillCommand = "redbeacon"
              $runtimeFolder = ".redbeacon"
              $typeSuffix = "Stable"
            }

            $pkgRoot = Join-Path $build "pkg-$Channel"
            $appDir = Join-Path $pkgRoot $appName
            $assetDir = Join-Path $appDir "_internal\assets"
            New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
            $cliPath = Join-Path $appDir "$cliName.exe"
            $cliSource = @"
          using System;
          using System.IO;
          namespace RedBeaconInstallerSmoke$typeSuffix {
            public static class Cli {
              public static int Main(string[] args) {
                if (args.Length > 0 && args[0] == "--version") { Console.WriteLine("redbeacon 9.9.9"); return 0; }
                if (args.Length > 0 && args[0] == "setup") {
                  var home = Environment.GetFolderPath(Environment.SpecialFolder.UserProfile);
                  var root = Path.Combine(home, "$runtimeFolder");
                  if (Environment.GetEnvironmentVariable("REDBEACON_DATA_DIR") != Path.Combine(root, "data")) return 34;
                  if (Environment.GetEnvironmentVariable("PLAYWRIGHT_BROWSERS_PATH") != Path.Combine(root, "browser", "ms-playwright")) return 35;
                  if (Environment.GetEnvironmentVariable("CLOAKBROWSER_CACHE_DIR") != Path.Combine(root, "browser", "cloakbrowser")) return 36;
                  Console.WriteLine("{\"ok\":true}"); return 0;
                }
                if (Environment.GetEnvironmentVariable("REDBEACON_DESKTOP_SMOKE") == "1") {
                  Console.WriteLine("RedBeacon desktop smoke ok");
                }
                return 0;
              }
            }
          }
          "@
            Add-Type -TypeDefinition $cliSource -OutputAssembly $cliPath -OutputType ConsoleApplication
            Copy-Item -Force $cliPath (Join-Path $appDir "$appName.exe")

            $rendererPath = Join-Path $appDir "RedBeaconRenderer.exe"
            $rendererSource = @"
          using System;
          using System.IO;
          namespace RedBeaconInstallerSmokeRenderer$typeSuffix {
            public static class Renderer {
              public static int Main(string[] args) {
                string output = null;
                for (var i = 0; i + 1 < args.Length; i++) if (args[i] == "--output-dir") output = args[i + 1];
                if (String.IsNullOrEmpty(output)) return 41;
                Directory.CreateDirectory(output);
                File.WriteAllBytes(Path.Combine(output, "cover.png"), new byte[] { 1, 2, 3 });
                File.WriteAllBytes(Path.Combine(output, "card_1.png"), new byte[] { 1, 2, 3 });
                return 0;
              }
            }
          }
          "@
            Add-Type -TypeDefinition $rendererSource -OutputAssembly $rendererPath -OutputType ConsoleApplication
            [System.IO.File]::WriteAllBytes((Join-Path $assetDir "RedBeacon.ico"), [byte[]](0))

            $zipDir = Join-Path $fake $appPrefix
            New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
            $zip = Join-Path $zipDir "$appName-win-x64.zip"
            Compress-Archive -Path $appDir -DestinationPath $zip -Force
            $sha = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()

            $manifest = @{
              channel = $Channel
              version = "9.9.9"
              notes = "installer smoke"
              skill_raw_base = "http://127.0.0.1:8765/$skillPrefix/commands"
              skill_files = @($skillFile)
              app_sha256 = @{ "win-x64" = $sha }
            } | ConvertTo-Json -Depth 5
            Set-Content -Encoding UTF8 -Path (Join-Path $fake $manifestName) -Value $manifest

            $skillRoot = Join-Path $build "skill-$Channel"
            $commands = Join-Path $skillRoot ".claude\commands"
            New-Item -ItemType Directory -Force -Path $commands | Out-Null
            Set-Content -Encoding UTF8 -Path (Join-Path $commands $skillFile) -Value "---`ndescription: smoke $Channel`n---`n# smoke`n$skillCommand checkin"
            $skillDir = Join-Path $fake $skillPrefix
            New-Item -ItemType Directory -Force -Path $skillDir | Out-Null
            tar -czf (Join-Path $skillDir "redbeacon-skill.tar.gz") -C $skillRoot .
          }

          function ChannelSpec($Channel){
            if($Channel -eq "test"){
              return @{
                AppName = "RedBeacon_test"
                CmdName = "redbeacon-test"
                SkillFile = "redbeacon-test.md"
                SkillBase = "redbeacon-test"
                SkillDir = Join-Path $env:RUNNER_TEMP "skills-test"
              }
            }
            return @{
              AppName = "RedBeacon"
              CmdName = "redbeacon"
              SkillFile = "redbeacon.md"
              SkillBase = "redbeacon"
              SkillDir = Join-Path $env:RUNNER_TEMP "skills-stable"
            }
          }

          function Assert-Installed($Channel){
            $spec = ChannelSpec $Channel
            $dest = Join-Path $env:LOCALAPPDATA "Programs\$($spec.AppName)"
            $shim = Join-Path $HOME ".local\bin\$($spec.CmdName).cmd"
            $claudeSkill = Join-Path $spec.SkillDir $spec.SkillFile
            $codexSkill = Join-Path $HOME ".codex\skills\$($spec.SkillBase)\SKILL.md"
            if(-not (Test-Path $dest)){ throw "$Channel install did not create $dest" }
            if(-not (Test-Path $shim)){ throw "$Channel install did not create $shim" }
            if(-not (Test-Path $claudeSkill)){ throw "$Channel install did not copy Claude-style skill $claudeSkill" }
            if(-not (Test-Path $codexSkill)){ throw "$Channel install did not create Codex skill $codexSkill" }
            $codexText = Get-Content -Raw -Encoding UTF8 -Path $codexSkill
            if($codexText -notmatch "(?m)^name:\s*$([regex]::Escape($spec.SkillBase))\s*$"){
              throw "$Channel Codex skill frontmatter name is not $($spec.SkillBase)"
            }
            if($Channel -eq "test" -and $codexText -notmatch "redbeacon-test"){
              throw "test Codex skill does not point at redbeacon-test"
            }
          }

          function Assert-Uninstalled($Channel){
            $spec = ChannelSpec $Channel
            $dest = Join-Path $env:LOCALAPPDATA "Programs\$($spec.AppName)"
            $shim = Join-Path $HOME ".local\bin\$($spec.CmdName).cmd"
            $claudeSkill = Join-Path $spec.SkillDir $spec.SkillFile
            $codexSkill = Join-Path $HOME ".codex\skills\$($spec.SkillBase)\SKILL.md"
            if(Test-Path $dest){ throw "$Channel uninstall did not remove $dest" }
            if(Test-Path $shim){ throw "$Channel uninstall did not remove $shim" }
            if(Test-Path $claudeSkill){ throw "$Channel uninstall did not remove Claude-style skill $claudeSkill" }
            if(Test-Path $codexSkill){ throw "$Channel uninstall did not remove Codex skill $codexSkill" }
          }

          function Install-Channel($Channel){
            $spec = ChannelSpec $Channel
            $env:REDBEACON_OSS = "http://127.0.0.1:8765"
            $env:REDBEACON_CHANNEL = $Channel
            $env:REDBEACON_FORCE_INSTALL = "1"
            $env:REDBEACON_SKILL_DIR = $spec.SkillDir
            $env:REDBEACON_DATA_DIR = Join-Path $env:RUNNER_TEMP "foreign-data"
            $env:REDBEACON_PLAYWRIGHT_DIR = Join-Path $env:RUNNER_TEMP "foreign-playwright"
            $env:REDBEACON_CLOAKBROWSER_DIR = Join-Path $env:RUNNER_TEMP "foreign-cloak"
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP "foreign-system-playwright"
            $env:CLOAKBROWSER_CACHE_DIR = Join-Path $env:RUNNER_TEMP "foreign-system-cloak"
            & ./install/install.ps1
            Remove-Item Env:\REDBEACON_FORCE_INSTALL -ErrorAction SilentlyContinue
            Assert-Installed $Channel
          }

          function Uninstall-Channel($Channel){
            $spec = ChannelSpec $Channel
            $env:REDBEACON_CHANNEL = $Channel
            $env:REDBEACON_SKILL_DIR = $spec.SkillDir
            & ./install/uninstall.ps1
            Assert-Uninstalled $Channel
          }

          New-FakeChannel "stable"
          New-FakeChannel "test"

          $server = Start-Process -FilePath "python" -ArgumentList @("-m", "http.server", "8765", "--directory", $fake) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach($i in 1..30){
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:8765/latest.json" -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if(-not $ready){ throw "fake OSS server did not start" }

            Remove-Item -Recurse -Force (Join-Path $HOME ".codex\skills\redbeacon") -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force (Join-Path $HOME ".codex\skills\redbeacon-test") -ErrorAction SilentlyContinue

            Install-Channel "stable"
            Install-Channel "test"

            # Stable and test must coexist. Removing one channel must not remove
            # the other channel's Codex skill.
            Assert-Installed "stable"
            Assert-Installed "test"
            Uninstall-Channel "test"
            Assert-Installed "stable"
            Uninstall-Channel "stable"
          }
          finally {
            if($server -and -not $server.HasExited){ Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
