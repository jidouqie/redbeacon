name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The public checkout has no cli/ and must never receive a private token.
      # The local release build still runs the default, full provenance gate.
      - run: python tools/check_release_contracts.py --public-only
      - run: python -m unittest discover -s tools/tests -p test_channel_skills.py
      - run: python tools/check_entrypoint_drift.py
      - run: python -m unittest discover -s tools/tests -p test_entrypoint_drift.py
      - run: python tools/sync-codex-skills.py --check
      - run: python -m unittest discover -s tools/tests -p test_repository_artifacts.py
