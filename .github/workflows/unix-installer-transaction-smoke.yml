name: Unix installer transaction smoke

on:
  workflow_dispatch: {}
  push:
    branches: ['main', 'ci/bundle', 'refactor/**']
    paths:
      - 'install/**'
      - 'tools/smoke_unix_install_transaction.py'
      - '.github/workflows/unix-installer-transaction-smoke.yml'
  pull_request:
    paths:
      - 'install/**'
      - 'tools/smoke_unix_install_transaction.py'
      - '.github/workflows/unix-installer-transaction-smoke.yml'

concurrency:
  group: unix-installer-transaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test staged dependency preparation and rollback
        run: python3 tools/smoke_unix_install_transaction.py
